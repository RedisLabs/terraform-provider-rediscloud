name: Terraform Provider Checks - main branch

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
env:
  REDISCLOUD_ACCESS_KEY: ${{ secrets.REDISCLOUD_ACCESS_KEY_STAGING }}
  REDISCLOUD_SECRET_KEY: ${{ secrets.REDISCLOUD_SECRET_KEY_STAGING }}
  REDISCLOUD_URL: ${{ secrets.REDISCLOUD_URL_STAGING }}
  AWS_TEST_CLOUD_ACCOUNT_NAME: "${{ secrets.AWS_TEST_CLOUD_ACCOUNT_NAME_STAGING }}"
  AWS_PEERING_REGION: ${{ secrets.AWS_PEERING_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_VPC_CIDR: ${{ secrets.AWS_VPC_CIDR }}
  AWS_VPC_ID: ${{ secrets.AWS_VPC_ID }}
  AWS_TEST_TGW_ID: ${{ secrets.AWS_TEST_TGW_ID_STAGING }}
  TF_ACC: true
  TF_LOG: info
  AWS_ACCESS_KEY_ID: ${{ secrets.CLOUD_ACCOUNT_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_ACCOUNT_SECRET }}
  AWS_CONSOLE_USERNAME: ${{ secrets.CLOUD_ACCOUNT_USERNAME }}
  AWS_CONSOLE_PASSWORD: ${{ secrets.CLOUD_ACCOUNT_PASS }}
  AWS_SIGNIN_URL: ${{ secrets.CLOUD_ACCOUNT_URL }}
  GCP_VPC_PROJECT: ${{ secrets.GCP_VPC_PROJECT }}
  GCP_VPC_ID: ${{ secrets.GCP_VPC_ID }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  TEST_RESOURCE_PREFIX: "tf-ci-main-${{ github.run_number }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_sweep:
    name: pre-test sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/run-sweep
        with:
          sweep_prefix: 'tf-ci'

  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command make ci

  go_test_databases:
    name: go test Databases
    needs: [ci, pre_sweep]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(Essentials|Pro|ActiveActive)Database_.*
    secrets: inherit

  go_test_subscriptions:
    name: go test Subscriptions
    needs: [go_test_databases]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(Essentials|Pro|ActiveActive)Subscription_.*
    secrets: inherit

  go_test_subscriptions_tls:
    name: go test Subscriptions TLS
    needs: [go_test_subscriptions]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloudSubscriptionTls_.*
    secrets: inherit

  go_test_essentials_plan:
    name: go test Essentials Plan
    needs: [go_test_subscriptions_tls]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloudEssentialsPlan_.*
    secrets: inherit

  go_test_persistence_modules_regions_acl:
    name: go test Other
    needs: [go_test_essentials_plan]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(DataPersistence|DatabaseModules|Regions|Acl).*
    secrets: inherit

  go_test_cloud_account:
    name: go test Cloud Account
    needs: [go_test_persistence_modules_regions_acl]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(CloudAccount).*
    secrets: inherit

  go_test_transit_payment:
    name: go test Transit Gateway & Payment
    needs: [go_test_cloud_account]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(TransitGatewayAttachment|PaymentMethod).*
    secrets: inherit

  post_sweep:
    name: post-test sweep
    if: ${{ always() && !cancelled() }}
    # go_test_transit_payment is the terminal node of a strictly linear chain
    # (databases -> subscriptions -> ... -> transit_payment). If the chain gains
    # parallel branches in future, list all terminal jobs here explicitly
    # (see terraform_provider_pr.yml for an example).
    needs: [go_test_transit_payment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/run-sweep
        with:
          sweep_prefix: "tf-ci-main-${{ github.run_number }}"
          age_threshold: '0s'
