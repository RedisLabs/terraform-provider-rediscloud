name: Terraform Provider Checks - main branch

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command make ci

  testacc-databases:
    name: Acceptance Tests (Databases)
    needs: [ci]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(Essentials|Pro|ActiveActive)Database_.*
      create_account_sleep_seconds: 0
    secrets: inherit

  testacc-subscriptions:
    name: Acceptance Tests (Subscriptions)
    needs: [ci]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(Essentials|Pro|ActiveActive)Subscription_.*
      create_account_sleep_seconds: 30
    secrets: inherit

  testacc-subscriptions-tls:
    name: Acceptance Tests (Subscriptions TLS)
    needs: [ci]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloudSubscriptionTls_.*
      create_account_sleep_seconds: 60
    secrets: inherit

  testacc-essentials-plan:
    name: Acceptance Tests (Essentials Plan)
    needs: [ci]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloudEssentialsPlan_.*
      create_account_sleep_seconds: 90
    secrets: inherit

  testacc-persistence-modules-regions-acl:
    name: Acceptance Tests (Persistence Modules Regions ACL)
    needs: [ci]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(DataPersistence|DatabaseModules|Regions|Acl).*
      create_account_sleep_seconds: 120
    secrets: inherit

  testacc-cloud-account:
    name: Acceptance Tests (Cloud Account)
    needs: [ci]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(CloudAccount).*
      create_account_sleep_seconds: 150
    secrets: inherit

  testacc-transit-payment:
    name: Acceptance Tests (Transit Payment)
    needs: [ci]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(DataSource|Resource)RedisCloud(TransitGatewayAttachment|PaymentMethod).*
      create_account_sleep_seconds: 180
    secrets: inherit

  detect-agent-memory:
    name: Detect Agent Memory changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.agent_memory }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            agent_memory:
              - 'provider/agentmemory/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/testacc.yml'

  testacc-agent-memory:
    name: Acceptance Tests (Agent Memory)
    needs: [ci, detect-agent-memory]
    if: >-
      !cancelled() && needs.ci.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.detect-agent-memory.outputs.changed == 'true')
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: '^TestAccResourceRedisCloudAgentMemory_'
      create_account_sleep_seconds: 210
      sweep_agent_memory: true
    secrets: inherit
