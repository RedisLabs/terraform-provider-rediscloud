name: Acceptance Tests (reusable)

# Reusable workflow that runs a single slice of the acceptance-test suite,
# selected by `test_pattern`. Callers wire ordering via `needs:` and must pass
# `secrets: inherit` (a called workflow does NOT inherit the caller's env/secrets).
#
# Each invocation provisions its OWN throwaway Redis Cloud account: it mints a
# GitHub App token for the private provisioning repo, dispatches that repo's
# `create-credentials` workflow (which encrypts a fresh account's credentials to
# an ephemeral age key we generate here), decrypts them, runs the tests, sweeps
# any leftover resources, then dispatches `delete-credentials` to tear the
# account down. The account is disposable, so there is no shared state to
# pre-sweep and the caller only needs a lightweight gate before this runs.
on:
  workflow_call:
    inputs:
      test_pattern:
        description: 'Test pattern passed to the -run flag'
        required: true
        type: string
      create_account_sleep_seconds:
        description: 'Seconds to sleep (stagger) ephemeral account creation'
        required: true
        type: number

permissions:
  contents: read

env:
  # REDISCLOUD_URL / REDISCLOUD_ACCESS_KEY / REDISCLOUD_SECRET_KEY are intentionally absent here:
  # they are produced per-run by the ephemeral account and live only as shell
  # variables inside the single "Run tests with ephemeral credentials" step.
  AWS_TEST_CLOUD_ACCOUNT_NAME: "${{ secrets.AWS_TEST_CLOUD_ACCOUNT_NAME_STAGING }}"
  AWS_PEERING_REGION: ${{ secrets.AWS_PEERING_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_VPC_CIDR: ${{ secrets.AWS_VPC_CIDR }}
  AWS_VPC_ID: ${{ secrets.AWS_VPC_ID }}
  AWS_TEST_TGW_ID: ${{ secrets.AWS_TEST_TGW_ID_STAGING }}
  AWS_ACCESS_KEY_ID: ${{ secrets.CLOUD_ACCOUNT_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUD_ACCOUNT_SECRET }}
  AWS_CONSOLE_USERNAME: ${{ secrets.CLOUD_ACCOUNT_USERNAME }}
  AWS_CONSOLE_PASSWORD: ${{ secrets.CLOUD_ACCOUNT_PASS }}
  AWS_SIGNIN_URL: ${{ secrets.CLOUD_ACCOUNT_URL }}
  GCP_VPC_PROJECT: ${{ secrets.GCP_VPC_PROJECT }}
  GCP_VPC_ID: ${{ secrets.GCP_VPC_ID }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  # Derived from the caller's trigger context (shared with this reusable
  # workflow): PRs get "tf-ci-pr<number>-<run>", everything else (push /
  # workflow_dispatch on main) gets "tf-ci-main-<run>".
  TEST_RESOURCE_PREFIX: ${{ github.event_name == 'pull_request' && format('tf-ci-pr{0}-{1}', github.event.pull_request.number, github.run_number) || format('tf-ci-main-{0}', github.run_number) }}

jobs:
  testacc:
    runs-on: ubuntu-latest
    # The GitHub App private key and its client id live in this environment,
    # alongside any other credentials the provisioning flow needs.
    environment: integration-tests
    env:
      PRIVATE_OWNER: redislabsdev
      PRIVATE_REPO: terraform-provider-rediscloud-private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fail fast if the caller's pattern matches no tests, BEFORE provisioning an
      # account: `go test -run` exits 0 on no match, so `make testacc-check` uses
      # `-list` to verify the pattern first (no credentials needed).
      - name: Verify test pattern matches
        shell: nix develop --command bash -e {0}
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
        run: make testacc-check

      # Short-lived installation token scoped to the private provisioning repo,
      # used to dispatch its workflows and download the encrypted artifact.
      - name: Mint GitHub App token (Create Account)
        id: app-token-create-account
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_PROVIDER_REDISCLOUD_CREDS_CLIENT_ID }}
          private-key: ${{ secrets.TF_PROVIDER_REDISCLOUD_CREDS_PRIVATE_KEY }}
          owner: ${{ env.PRIVATE_OWNER }}
          repositories: ${{ env.PRIVATE_REPO }}
          permission-actions: write

      # Fresh keypair per run; only the public recipient leaves this runner, so
      # nobody but this job can decrypt the credentials artifact.
      - name: Generate ephemeral age keypair
        id: keygen
        shell: nix develop --command bash -e {0}
        run: |
          set -euo pipefail
          age-keygen -o "$RUNNER_TEMP/age-key.txt"
          public_key=$(age-keygen -y "$RUNNER_TEMP/age-key.txt")
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"

      - name: Stagger ephemeral account creation
        shell: bash
        env:
          OFFSET_SECONDS: ${{ inputs.create_account_sleep_seconds }}
        run: sleep "$OFFSET_SECONDS"

      # Ask the private repo to provision an account and encrypt its credentials
      # with our public key. Waits for the run and exposes its runId.
      - name: Create ephemeral credentials
        id: create
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          workflow: create-credentials.yml
          repo: ${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}
          ref: main
          token: ${{ steps.app-token-create-account.outputs.token }}
          wait-for-completion: true
          wait-timeout-seconds: 600
          sync-status: true
          inputs: |
            {
              "age_recipient": "${{ steps.keygen.outputs.public_key }}"
            }

      - name: Download encrypted credentials
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ steps.app-token-create-account.outputs.token }}
          repository: ${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}
          run-id: ${{ steps.create.outputs.runId }}
          name: encrypted-credentials-${{ steps.create.outputs.runId }}
          path: ${{ runner.temp }}/artifact

      # Decrypt and test. The account key/secret only ever exist as shell
      # variables inside this one process: they are exported under the
      # provider's env-var names but never written to $GITHUB_ENV,
      # $GITHUB_OUTPUT, or disk, so they cannot leak into later steps. Only the
      # opaque cleanup token is persisted as an output (written up front, so the
      # sweep and deletion steps still run when the tests fail). The age key and
      # ciphertext are NOT removed here: the separate sweep step below
      # re-decrypts them, and a final always() step deletes them. The shell is
      # the Nix dev shell, so age/jq/go/make are all on PATH.
      - name: Run tests with ephemeral credentials
        id: creds
        shell: nix develop --command bash -e {0}
        env:
          TEST_PATTERN: ${{ inputs.test_pattern }}
        run: |
          set -euo pipefail

          plaintext=$(age -d -i "$RUNNER_TEMP/age-key.txt" "$RUNNER_TEMP/artifact/credentials.json.age")
          cloud_url="$(jq -er '.cloudUrl' <<< "$plaintext")"
          access_key="$(jq -er '.accessKey' <<< "$plaintext")"
          access_secret="$(jq -er '.secretKey' <<< "$plaintext")"
          token="$(jq -er '.token' <<< "$plaintext")"
          unset plaintext
          # Mask before any use, then re-export under the provider's env-var
          # names; the export stays confined to this step's process.
          echo "::add-mask::$cloud_url"
          echo "::add-mask::$access_key"
          echo "::add-mask::$access_secret"
          echo "::add-mask::$token"

          export REDISCLOUD_URL="$cloud_url"
          export REDISCLOUD_ACCESS_KEY="$access_key"
          export REDISCLOUD_SECRET_KEY="$access_secret"

          # Persist the cleanup token before running tests so the sweep and
          # deletion steps fire even if the tests below fail.
          echo "token=$token" >> "$GITHUB_OUTPUT"

          # Run the acceptance tests. The pattern was already validated by the
          # "Verify test pattern matches" step above, and the credentials exported
          # above stay confined to this step's process. No inline error handling or
          # sweep is needed here: if the tests fail, `set -e` fails the step, and
          # teardown still runs via the separate always() sweep and delete steps
          # below (the cleanup token was persisted above).
          make testacc

      # Sweep the throwaway account's resources in a SEPARATE always() step so
      # it also runs when the test step is cancelled (an inline sweep dies with
      # the cancelled step). This is required for teardown: delete-credentials
      # refuses to remove a non-empty account, so a live subscription/database
      # would otherwise orphan the whole account. Credentials are re-decrypted
      # here rather than carried over, so the key/secret still never leave a
      # single step's process. Best-effort: a sweep error only warns.
      # SWEEP_AGE_THRESHOLD=0s sweeps everything in this account regardless of age.
      - name: Sweep ephemeral account
        if: always() && steps.creds.outputs.token != ''
        shell: nix develop --command bash -e {0}
        run: |
          set -euo pipefail

          plaintext=$(age -d -i "$RUNNER_TEMP/age-key.txt" "$RUNNER_TEMP/artifact/credentials.json.age")
          cloud_url="$(jq -er '.cloudUrl' <<< "$plaintext")"
          access_key="$(jq -er '.accessKey' <<< "$plaintext")"
          access_secret="$(jq -er '.secretKey' <<< "$plaintext")"
          unset plaintext
          echo "::add-mask::$cloud_url"
          echo "::add-mask::$access_key"
          echo "::add-mask::$access_secret"

          export REDISCLOUD_URL="$cloud_url"
          export REDISCLOUD_ACCESS_KEY="$access_key"
          export REDISCLOUD_SECRET_KEY="$access_secret"

          if ! SWEEP_AGE_THRESHOLD='0s' make sweep 2>&1; then
            echo "::warning::Sweep of prefix '$TEST_RESOURCE_PREFIX' completed with errors - some resources may not have been cleaned up"
          fi

      # GitHub tokens expire after 1 hour, so the token minted at the start of the job
      # may expire for longer running tests.
      - name: Mint GitHub App token (Delete Account)
        id: app-token-delete-account
        if: always() && steps.creds.outputs.token != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TF_PROVIDER_REDISCLOUD_CREDS_CLIENT_ID }}
          private-key: ${{ secrets.TF_PROVIDER_REDISCLOUD_CREDS_PRIVATE_KEY }}
          owner: ${{ env.PRIVATE_OWNER }}
          repositories: ${{ env.PRIVATE_REPO }}
          permission-actions: write

      # Delete the throwaway account. The token is the account id encrypted to
      # the private repo's own key, so only that repo can act on it.
      - name: Delete ephemeral credentials
        if: always() && steps.creds.outputs.token != ''
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          workflow: delete-credentials.yml
          repo: ${{ env.PRIVATE_OWNER }}/${{ env.PRIVATE_REPO }}
          ref: main
          token: ${{ steps.app-token-delete-account.outputs.token }}
          wait-for-completion: true
          wait-timeout-seconds: 600
          sync-status: true
          inputs: |
            {
              "token": "${{ steps.creds.outputs.token }}"
            }

      # Remove the decrypted key material now that every step that needs it (the
      # test and sweep steps) has run. This replaces the EXIT trap the test step
      # used to carry, which had to go so the sweep step could re-decrypt.
      - name: Remove decrypted credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/age-key.txt" "$RUNNER_TEMP/artifact/credentials.json.age"
