name: Acceptance test AA local throughput

# Manual live run of the Active-Active local throughput acceptance test.
# Uses the shared throwaway Redis Cloud account flow.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/testacc-aa-local-throughput.yml
      - provider/activeactive/**
  workflow_dispatch:

jobs:
  testacc-local-throughput:
    name: Acceptance Tests (AA local throughput)
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudActiveActiveDatabase_LocalThroughput
      create_account_sleep_seconds: 0
    secrets: inherit
