name: Terraform Provider Checks - PR workflow

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'GNUmakefile'
              - 'provider/**/testdata/**'
              - '.github/**'
              - 'scripts/**'

  # Gate job: all non-test checks (golangci-lint, go mod tidy, terraform fmt,
  # govulncheck, tfproviderlint, docs, build, schema, unit tests) run via
  # `make ci` inside the Nix dev shell, which provides the full toolchain.
  # Must pass before the smoke tests run.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command make ci

  pre-test:
    name: Pre-test Gate
    needs: [ci, detect-changes]
    if: >
      github.event.pull_request.draft == false &&
      needs.detect-changes.outputs.code == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-tests')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gate passed - running acceptance tests"

  # =====================================================================
  # DELETE ME CI: temporary scoped acceptance-test jobs.
  # These run ONLY the tests touched by this branch's fix commits, in
  # parallel. Delete all "DELETE ME CI:" commits before merging to restore
  # the full smoke-test suite.
  # =====================================================================

  testacc-pro-db-auto-minor-upgrade:
    name: Acceptance Tests (Pro DB Auto Minor Upgrade)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProDatabase_autoMinorVersionUpgrade$
    secrets: inherit

  testacc-pro-db-redis8-modules-blocked:
    name: Acceptance Tests (Pro DB Redis8 Modules Blocked)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProDatabase_Redis8_ModulesBlocked$
    secrets: inherit

  testacc-pro-db-redis8-ramflash-crudi:
    name: Acceptance Tests (Pro DB Redis8 RamAndFlash CRUDI)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProDatabase_Redis8_RamAndFlash_CRUDI$
    secrets: inherit

  testacc-essentials-db-redis-version:
    name: Acceptance Tests (Essentials DB Redis Version)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudEssentialsDatabase_RedisVersion$
    secrets: inherit

  testacc-pro-sub-qpf:
    name: Acceptance Tests (Pro Sub QPF)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProSubscription_qpf$
    secrets: inherit

  testacc-pro-sub-crudi-redis7:
    name: Acceptance Tests (Pro Sub CRUDI Redis7)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProSubscription_CRUDI_Redis7$
    secrets: inherit

  testacc-pro-sub-crudi-redis8:
    name: Acceptance Tests (Pro Sub CRUDI Redis8)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProSubscription_CRUDI_Redis8$
    secrets: inherit

  testacc-pro-sub-cmk-aws:
    name: Acceptance Tests (Pro Sub CMK AWS)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProSubscription_CMK_AWS$
    secrets: inherit

  testacc-ds-pro-sub-basic:
    name: Acceptance Tests (DS Pro Sub Basic)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccDataSourceRedisCloudProSubscription_basic$
    secrets: inherit

  testacc-ds-pro-sub-ignoresaa:
    name: Acceptance Tests (DS Pro Sub IgnoresAA)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccDataSourceRedisCloudProSubscription_ignoresAA$
    secrets: inherit

  testacc-pro-sub-public-endpoint:
    name: Acceptance Tests (Pro Sub Public Endpoint Access)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProSubscription_PublicEndpointAccess$
    secrets: inherit

  testacc-aa-sub-cmk:
    name: Acceptance Tests (AA Sub CMK)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudActiveActiveSubscription_CMK$
    secrets: inherit

  testacc-aa-sub-cmk-aws:
    name: Acceptance Tests (AA Sub CMK AWS)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudActiveActiveSubscription_CMK_AWS$
    secrets: inherit

  status:
    name: Status
    runs-on: ubuntu-latest
    needs:
      - ci
      - testacc-pro-db-auto-minor-upgrade
      - testacc-pro-db-redis8-modules-blocked
      - testacc-pro-db-redis8-ramflash-crudi
      - testacc-essentials-db-redis-version
      - testacc-pro-sub-qpf
      - testacc-pro-sub-crudi-redis7
      - testacc-pro-sub-crudi-redis8
      - testacc-pro-sub-cmk-aws
      - testacc-ds-pro-sub-basic
      - testacc-ds-pro-sub-ignoresaa
      - testacc-pro-sub-public-endpoint
      - testacc-aa-sub-cmk
      - testacc-aa-sub-cmk-aws
    if: always()
    steps:
      - name: Check CI status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed or were cancelled"
          echo "Job results: ${{ toJSON(needs.*.result) }}"
          exit 1
