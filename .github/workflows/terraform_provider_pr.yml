name: Terraform Provider Checks - PR workflow

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'GNUmakefile'
              - 'provider/**/testdata/**'
              - '.github/**'
              - 'scripts/**'

  # Gate job: all non-test checks (golangci-lint, go mod tidy, terraform fmt,
  # govulncheck, tfproviderlint, docs, build, schema, unit tests) run via
  # `make ci` inside the Nix dev shell, which provides the full toolchain.
  # Must pass before the smoke tests run.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command make ci

  pre-test:
    name: Pre-test Gate
    needs: [ci, detect-changes]
    if: >
      github.event.pull_request.draft == false &&
      needs.detect-changes.outputs.code == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-tests')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gate passed - running acceptance tests"

  testacc-smoke-aa-sub:
    name: Acceptance Tests (Smoke AA Sub)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudActiveActiveSubscription_CRUDI
    secrets: inherit

  testacc-smoke-aa-db:
    name: Acceptance Tests (Smoke AA DB)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudActiveActiveDatabase_CRUDI
    secrets: inherit

  testacc-smoke-aa-regions:
    name: Acceptance Tests (Smoke AA Regions)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudActiveActiveSubscriptionRegions_CRUDI
    secrets: inherit

  testacc-smoke-aa-enable-default-user:
    name: Acceptance Tests (Smoke AA Enable Default User)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudActiveActiveDatabase_enableDefaultUser
    secrets: inherit

  testacc-smoke-pro-sub:
    name: Acceptance Tests (Smoke Pro Sub)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProSubscription_CRUDI
    secrets: inherit

  testacc-smoke-pro-db:
    name: Acceptance Tests (Smoke Pro DB)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProDatabase_CRUDI
    secrets: inherit

  testacc-smoke-essentials-sub:
    name: Acceptance Tests (Smoke Essentials Sub)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudEssentialsSubscription
    secrets: inherit


  testacc-smoke-essentials-db:
    name: Acceptance Tests (Smoke Essentials DB)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudEssentialsDatabase_CRUDI
    secrets: inherit

  testacc-smoke-misc:
    name: Acceptance Tests (Smoke Misc)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloud(PrivateServiceConnect_CRUDI|AclRule_CRUDI)
    secrets: inherit

  testacc-pro-db-upgrade:
    name: Acceptance Tests (Pro DB Upgrade)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAccResourceRedisCloudProDatabase_Redis8_Upgrade
    secrets: inherit

  testacc-block-public-endpoints:
    name: Acceptance Tests (Block Public Endpoints)
    needs: [pre-test]
    uses: ./.github/workflows/testacc.yml
    with:
      test_pattern: TestAcc(RedisCloudProDatabase_BlockPublicEndpoints|ActiveActiveSubscriptionDatabase_BlockPublicEndpoints)
    secrets: inherit

  status:
    name: Status
    runs-on: ubuntu-latest
    needs:
      - ci
      - testacc-smoke-aa-sub
      - testacc-smoke-aa-db
      - testacc-smoke-aa-regions
      - testacc-smoke-aa-enable-default-user
      - testacc-smoke-pro-sub
      - testacc-smoke-pro-db
      - testacc-smoke-essentials-sub
      - testacc-smoke-essentials-db
      - testacc-smoke-misc
      - testacc-pro-db-upgrade
      - testacc-block-public-endpoints
    if: always()
    steps:
      - name: Check CI status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required jobs failed or were cancelled"
          echo "Job results: ${{ toJSON(needs.*.result) }}"
          exit 1
