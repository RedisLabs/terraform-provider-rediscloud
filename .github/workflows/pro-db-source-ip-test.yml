name: Pro database create source IP regression
on:
  pull_request:
    branches: ['release/*', 'codex/pro-db-source-cidr-create', 'codex/pro-db-source-ip-observation']
    paths:
      - 'provider/pro/resource_rediscloud_pro_database.go'
      - 'provider/pro/resource_rediscloud_pro_database_source_ips_test.go'
      - 'provider/pro/resource_rediscloud_pro_database_source_ips_read_test.go'
      - 'provider/pro/resource_rediscloud_pro_database_import_phase_test.go'
      - '.github/workflows/pro-db-source-ip-test.yml'
permissions:
  contents: read
jobs:
  fake-create:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.26.11'
      - name: Exercise actual create handler against loopback fake
        shell: bash
        run: |
          set -euo pipefail
          go test ./provider/pro -count=1 -run '^TestUnitProDatabaseCreateSourceIPs$' -v | tee "$RUNNER_TEMP/receipt.log"
          for case in custom_private_parent custom_public_parent omitted_private_parent omitted_public_parent public_default_private_parent public_default_public_parent private_default_public_parent private_default_private_parent default_unknown_policy default_lookup_failure; do
            grep -F -- "--- PASS: TestUnitProDatabaseCreateSourceIPs/$case " "$RUNNER_TEMP/receipt.log"
          done
      - name: Exercise actual read handler against loopback fake
        shell: bash
        run: |
          set -euo pipefail
          go test ./provider/pro -count=1 -run '^TestUnitProDatabaseReadObservedSourceIPs$' -v | tee "$RUNNER_TEMP/read-receipt.log"
          for case in missing_security null_security missing null null_element empty public_drift custom_drift unchanged; do
            grep -F -- "--- PASS: TestUnitProDatabaseReadObservedSourceIPs/$case " "$RUNNER_TEMP/read-receipt.log"
          done
      - name: Exercise SDK protocol import and fake refresh
        shell: bash
        run: |
          set -euo pipefail
          go test ./provider/pro -count=1 -run '^TestProDatabaseProtocolImportSourceIPs$' -v | tee "$RUNNER_TEMP/import-receipt.log"
          for case in custom public_default private_default_public_parent private_default_private_parent; do
            grep -F -- "--- PASS: TestProDatabaseProtocolImportSourceIPs/$case " "$RUNNER_TEMP/import-receipt.log"
          done
